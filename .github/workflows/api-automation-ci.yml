name: API Test Automation Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 18 * * *'  # Runs daily at 11:30 PM IST (18:00 UTC)
  workflow_dispatch:      # Allows manual trigger with suite parameters
    inputs:
      test_suite:
        description: 'Select TestNG suite profile'
        required: true
        default: 'regression'
        type: choice
        options:
          - regression
          - smoke
          - security
      environment:
        description: 'Target test environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - dev
          - stage

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install and Start Mockoon CLI
        run: |
          npm install -g @mockoon/cli

          # Identify mock file location
          MOCK_FILE="src/test/resources/mockoon-environment.json"
          if [ ! -f "$MOCK_FILE" ]; then
            MOCK_FILE="mockoon-environment.json"
          fi
          echo "Using mock file: $MOCK_FILE"

          # Start mockoon in true background daemon mode (does not block the shell)
          mockoon-cli start --data "$MOCK_FILE" --port 8089 --daemonOff false || \
          nohup mockoon-cli start --data "$MOCK_FILE" --port 8089 > mockoon.log 2>&1 &

          # Health check polling loop (max 15 seconds)
          echo "Waiting for Mockoon to respond on port 8089..."
          READY=0
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8089/api/orders || true)
            if [ "$STATUS" != "000" ] && [ -n "$STATUS" ]; then
              echo "Mockoon is up and healthy (HTTP $STATUS) on attempt $i."
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -eq 0 ]; then
            echo "Mockoon failed to start in time. Mockoon log output:"
            cat mockoon.log 2>/dev/null || true
            exit 1
          fi

      - name: Execute Maven Tests
        run: |
          SUITE="${{ github.event.inputs.test_suite || 'regression' }}"
          ENV="${{ github.event.inputs.environment || 'qa' }}"
          mvn clean test -P${SUITE} -Denv=${ENV}

      - name: Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Execution-Logs
          path: logs/
          if-no-files-found: ignore

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Extent-Report
          path: target/extent-reports/
          if-no-files-found: ignore

      - name: Upload TestNG Emailable Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Reports
          path: target/surefire-reports/emailable-report.html
          if-no-files-found: ignore

      - name: Publish TestNG Results to Checks Tab
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: TestNG Execution Results
          path: 'target/surefire-reports/testng-results.xml'
          reporter: java-junit
          fail-on-error: false
